<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>NEBULA GRAIN - Sequencer & Physics Edition</title>
  <style>
    :root {
      --bg-color: #0b0d12;
      --panel-bg: rgba(20, 24, 33, 0.85);
      --accent-cyan: #00f3ff;
      --accent-amber: #ffb300;
      --accent-pink: #ff0055;
      --text-main: #e0e6ed;
      --text-sub: #7a8b9e;
      --border-color: rgba(0, 243, 255, 0.2);
      --font-mono: 'Courier New', Courier, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100dvh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    header {
      height: 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 12px;
      background: rgba(11, 13, 18, 0.95);
      border-bottom: 1px solid var(--border-color);
    }

    .logo {
      font-family: var(--font-mono);
      font-weight: bold;
      font-size: 14px;
      letter-spacing: 1.5px;
      color: var(--accent-cyan);
      text-shadow: 0 0 8px rgba(0, 243, 255, 0.4);
    }

    .top-actions {
      display: flex;
      gap: 8px;
    }

    .btn-top {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 4px 10px;
      font-size: 11px;
      border-radius: 4px;
      font-family: var(--font-mono);
      cursor: pointer;
    }

    .btn-top.active {
      background: var(--accent-pink);
      color: #fff;
      font-weight: bold;
      border-color: var(--accent-pink);
    }

    /* Waveform & Physics Canvas Area */
    .canvas-container {
      flex: 1;
      position: relative;
      width: 100%;
      background: #050608;
      overflow: hidden;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .canvas-tools {
      position: absolute;
      top: 8px;
      left: 8px;
      display: flex;
      gap: 6px;
      z-index: 10;
    }

    .btn-mode {
      background: rgba(11, 13, 18, 0.8);
      border: 1px solid var(--border-color);
      color: var(--text-sub);
      padding: 4px 8px;
      font-size: 10px;
      border-radius: 4px;
      font-family: var(--font-mono);
    }

    .btn-mode.active {
      color: var(--accent-amber);
      border-color: var(--accent-amber);
      background: rgba(255, 179, 0, 0.15);
    }

    /* Lower Control Dock */
    .control-dock {
      height: 220px;
      background: var(--panel-bg);
      border-top: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
    }

    .tabs {
      display: flex;
      height: 32px;
      border-bottom: 1px solid var(--border-color);
      background: rgba(0,0,0,0.3);
    }

    .tab {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--text-sub);
      border-right: 1px solid rgba(255,255,255,0.05);
      cursor: pointer;
    }

    .tab.active {
      color: var(--accent-cyan);
      background: rgba(0, 243, 255, 0.08);
      border-bottom: 2px solid var(--accent-cyan);
    }

    .tab-content {
      flex: 1;
      display: none;
      padding: 12px;
      overflow-y: auto;
    }

    .tab-content.active {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .param-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .param-label {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      font-family: var(--font-mono);
      color: var(--text-sub);
    }

    .param-value {
      color: var(--accent-cyan);
    }

    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 4px;
      border-radius: 2px;
      background: #1a222d;
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--accent-cyan);
      cursor: pointer;
      box-shadow: 0 0 6px rgba(0, 243, 255, 0.6);
    }

    select {
      background: #121620;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px;
      border-radius: 4px;
      font-size: 11px;
      font-family: var(--font-mono);
      outline: none;
    }

    .btn-group {
      display: flex;
      gap: 6px;
    }

    .btn-opt {
      flex: 1;
      background: #121620;
      border: 1px solid var(--border-color);
      color: var(--text-sub);
      padding: 6px;
      font-size: 10px;
      font-family: var(--font-mono);
      border-radius: 4px;
      text-align: center;
    }

    .btn-opt.active {
      background: rgba(0, 243, 255, 0.2);
      color: var(--accent-cyan);
      border-color: var(--accent-cyan);
    }

    #fileInput {
      display: none;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">NEBULA GRAIN</div>
    <div class="top-actions">
      <button class="btn-top" id="btnMic">REC MIC</button>
      <button class="btn-top" id="btnFile">LOAD FILE</button>
      <input type="file" id="fileInput" accept="audio/*">
    </div>
  </header>

  <div class="canvas-container" id="canvasContainer">
    <canvas id="mainCanvas"></canvas>
    <div class="canvas-tools">
      <button class="btn-mode active" id="modeDrop">DROP BALL</button>
      <button class="btn-mode" id="modeDraw">DRAW WALL</button>
      <button class="btn-mode" id="btnClearWalls">CLEAR WALLS</button>
    </div>
  </div>

  <div class="control-dock">
    <div class="tabs">
      <div class="tab active" data-target="tabEngine">ENGINE</div>
      <div class="tab" data-target="tabSeq">SEQ & BALLS</div>
      <div class="tab" data-target="tabScale">SCALE & FX</div>
    </div>

    <!-- ENGINE TAB -->
    <div class="tab-content active" id="tabEngine">
      <div class="param-group">
        <div class="param-label">GRAIN SIZE <span class="param-value" id="valSize">80ms</span></div>
        <input type="range" id="paramSize" min="10" max="300" value="80">
      </div>
      <div class="param-group">
        <div class="param-label">SPRAY (POS JITTER) <span class="param-value" id="valSpray">20%</span></div>
        <input type="range" id="paramSpray" min="0" max="100" value="20">
      </div>
      <div class="param-group">
        <div class="param-label">PITCH / SPEED <span class="param-value" id="valPitch">1.0x</span></div>
        <input type="range" id="paramPitch" min="0.2" max="2.0" step="0.05" value="1.0">
      </div>
      <div class="param-group">
        <div class="param-label">PLAY DIRECTION</div>
        <div class="btn-group">
          <div class="btn-opt active" id="dirFwd">FWD</div>
          <div class="btn-opt" id="dirRev">REV</div>
          <div class="btn-opt" id="dirPing">PING-PONG</div>
        </div>
      </div>
    </div>

    <!-- SEQ & BALLS TAB -->
    <div class="tab-content" id="tabSeq">
      <div class="param-group">
        <div class="param-label">SPAWN RATE <span class="param-value" id="valRate">120ms</span></div>
        <input type="range" id="paramRate" min="40" max="500" value="120">
      </div>
      <div class="param-group">
        <div class="param-label">LOOP START (A) <span class="param-value" id="valStart">0%</span></div>
        <input type="range" id="paramStart" min="0" max="100" value="0">
      </div>
      <div class="param-group">
        <div class="param-label">LOOP END (B) <span class="param-value" id="valEnd">100%</span></div>
        <input type="range" id="paramEnd" min="0" max="100" value="100">
      </div>
      <div class="param-group">
        <button class="btn-top" id="btnClearBalls" style="margin-top: auto; padding: 8px;">CLEAR ALL BALLS</button>
      </div>
    </div>

    <!-- SCALE & FX TAB -->
    <div class="tab-content" id="tabScale">
      <div class="param-group">
        <div class="param-label">ROOT KEY</div>
        <select id="selectKey">
          <option value="0">C</option>
          <option value="2">D</option>
          <option value="3" selected>D# / Eb</option>
          <option value="5">F</option>
          <option value="7">G</option>
          <option value="8">G# / Ab</option>
          <option value="10">A# / Bb</option>
        </select>
      </div>
      <div class="param-group">
        <div class="param-label">SCALE</div>
        <select id="selectScale">
          <option value="minorPenta">Minor Pentatonic (Lo-Fi)</option>
          <option value="dori">Dorian (Chill Beats)</option>
          <option value="insen">Japanese Insen (Ambient)</option>
          <option value="lydian">Lydian (Ethereal)</option>
        </select>
      </div>
      <div class="param-group">
        <div class="param-label">FILTER CUTOFF <span class="param-value" id="valFilter">4000Hz</span></div>
        <input type="range" id="paramFilter" min="200" max="12000" value="4000">
      </div>
      <div class="param-group">
        <div class="param-label">SPACE REVERB <span class="param-value" id="valReverb">40%</span></div>
        <input type="range" id="paramReverb" min="0" max="100" value="40">
      </div>
    </div>
  </div>

  <script>
    // --- Audio Context & Core Setup ---
    let audioCtx = null;
    let audioBuffer = null;
    let micStream = null;
    let isRecording = false;
    let mediaRecorder = null;
    let recordedChunks = [];

    // Audio Parameters
    let grainSize = 0.08;
    let spray = 0.2;
    let playbackPitch = 1.0;
    let playDirection = 'fwd';
    let pingPongDir = 1;
    let loopStart = 0.0;
    let loopEnd = 1.0;
    let currentPos = 0.0;

    // Sequencer Parameters
    let spawnRateMs = 120;
    let lastSpawnTime = 0;
    let isTouching = false;
    let touchX = 0, touchY = 0;

    // Scales definition
    const SCALES = {
      minorPenta: [0, 3, 5, 7, 10, 12, 15, 17, 19, 22],
      dori: [0, 2, 3, 5, 7, 9, 10, 12, 14, 15],
      insen: [0, 1, 5, 7, 10, 12, 13, 17, 19],
      lydian: [0, 2, 4, 6, 7, 9, 11, 12, 14, 16]
    };

    let rootKey = 3;
    let activeScale = SCALES.minorPenta;

    let masterGain, filterNode;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        masterGain = audioCtx.createGain();
        masterGain.gain.value = 0.8;

        filterNode = audioCtx.createBiquadFilter();
        filterNode.type = 'lowpass';
        filterNode.frequency.value = 4000;

        filterNode.connect(masterGain);
        masterGain.connect(audioCtx.destination);

        createDefaultBuffer();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function createDefaultBuffer() {
      const sr = audioCtx.sampleRate || 44100;
      const len = sr * 3;
      audioBuffer = audioCtx.createBuffer(2, len, sr);
      for (let ch = 0; ch < 2; ch++) {
        const data = audioBuffer.getChannelData(ch);
        for (let i = 0; i < len; i++) {
          const t = i / sr;
          data[i] = (Math.sin(2 * Math.PI * 130.81 * t) * 0.4 + 
                     Math.sin(2 * Math.PI * 196.00 * t) * 0.3 + 
                     (Math.random() - 0.5) * 0.03) * Math.exp(-t * 0.3);
        }
      }
    }

    function triggerGrain(pitchMultiplier = 1.0, pan = 0.0) {
      if (!audioBuffer || !audioCtx) return;

      const source = audioCtx.createBufferSource();
      source.buffer = audioBuffer;

      const jitter = (Math.random() - 0.5) * spray * (loopEnd - loopStart);
      let pos = currentPos + jitter;
      if (pos < loopStart) pos = loopStart;
      if (pos > loopEnd) pos = loopEnd;

      const offsetSec = pos * audioBuffer.duration;
      const durationSec = grainSize;

      source.playbackRate.value = Math.max(0.1, playbackPitch * pitchMultiplier);

      const gainNode = audioCtx.createGain();
      const panner = audioCtx.createStereoPanner ? audioCtx.createStereoPanner() : null;
      if (panner) panner.pan.value = pan;

      const now = audioCtx.currentTime;
      gainNode.gain.setValueAtTime(0, now);
      gainNode.gain.linearRampToValueAtTime(0.5, now + durationSec * 0.15);
      gainNode.gain.linearRampToValueAtTime(0, now + durationSec);

      source.connect(gainNode);
      if (panner) {
        gainNode.connect(panner);
        panner.connect(filterNode);
      } else {
        gainNode.connect(filterNode);
      }

      source.start(now, offsetSec, durationSec);
      spawnParticle(pos, pan);
    }

    // --- Canvas & Physics ---
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');
    let interactionMode = 'drop';

    let walls = [];
    let balls = [];
    let visualParticles = [];
    let isDrawingWall = false;
    let currentWallStart = null;

    function resizeCanvas() {
      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function spawnBall(x, y) {
      balls.push({
        x, y,
        vx: (Math.random() - 0.5) * 3,
        vy: -Math.random() * 2,
        radius: 7,
        life: 1.0
      });
      triggerGrain(1.0, (x / canvas.width) * 2 - 1);
    }

    function updatePhysics() {
      const gravity = 0.22;
      const nowMs = performance.now();

      // Continuous Spawn Sequencer
      if (isTouching && interactionMode === 'drop') {
        if (nowMs - lastSpawnTime >= spawnRateMs) {
          spawnBall(touchX, touchY);
          lastSpawnTime = nowMs;
        }
      }

      for (let i = balls.length - 1; i >= 0; i--) {
        const b = balls[i];
        b.vy += gravity;
        b.x += b.vx;
        b.y += b.vy;

        walls.forEach(w => {
          const res = checkLineCollision(b.x, b.y, b.radius, w.x1, w.y1, w.x2, w.y2);
          if (res.hit) {
            const dot = b.vx * res.nx + b.vy * res.ny;
            b.vx = (b.vx - 2 * dot * res.nx) * 0.78;
            b.vy = (b.vy - 2 * dot * res.ny) * 0.78;
            b.x += res.nx * res.overlap;
            b.y += res.ny * res.overlap;
            onBallBounce(b);
          }
        });

        if (b.y + b.radius > canvas.height) {
          b.y = canvas.height - b.radius;
          b.vy *= -0.6;
          if (Math.abs(b.vy) > 0.8) onBallBounce(b);
        }
        if (b.x - b.radius < 0 || b.x + b.radius > canvas.width) {
          b.vx *= -0.8;
          b.x = b.x < b.radius ? b.radius : canvas.width - b.radius;
        }

        b.life -= 0.002;
        if (b.life <= 0) balls.splice(i, 1);
      }

      // Playhead Movement
      if (playDirection === 'fwd') {
        currentPos += 0.001 * playbackPitch;
        if (currentPos > loopEnd) currentPos = loopStart;
      } else if (playDirection === 'rev') {
        currentPos -= 0.001 * playbackPitch;
        if (currentPos < loopStart) currentPos = loopEnd;
      } else if (playDirection === 'ping') {
        currentPos += 0.001 * playbackPitch * pingPongDir;
        if (currentPos >= loopEnd) { currentPos = loopEnd; pingPongDir = -1; }
        if (currentPos <= loopStart) { currentPos = loopStart; pingPongDir = 1; }
      }
    }

    function onBallBounce(ball) {
      const normalizedY = 1.0 - (ball.y / canvas.height);
      const noteIdx = Math.floor(normalizedY * activeScale.length);
      const interval = activeScale[Math.min(noteIdx, activeScale.length - 1)] + rootKey;
      const pitchMultiplier = Math.pow(2, (interval - 12) / 12);
      const pan = (ball.x / canvas.width) * 2.0 - 1.0;
      triggerGrain(pitchMultiplier, pan);
    }

    function checkLineCollision(px, py, r, x1, y1, x2, y2) {
      const dx = x2 - x1;
      const dy = y2 - y1;
      const len = Math.hypot(dx, dy);
      if (len === 0) return { hit: false };

      const u = Math.max(0, Math.min(1, ((px - x1) * dx + (py - y1) * dy) / (len * len)));
      const nearestX = x1 + u * dx;
      const nearestY = y1 + u * dy;
      const distX = px - nearestX;
      const distY = py - nearestY;
      const dist = Math.hypot(distX, distY);

      if (dist < r) {
        return { hit: true, nx: distX / (dist || 1), ny: distY / (dist || 1), overlap: r - dist };
      }
      return { hit: false };
    }

    function spawnParticle(posRatio, pan) {
      visualParticles.push({
        x: posRatio * canvas.width,
        y: canvas.height / 2 + (Math.random() - 0.5) * 50,
        vx: pan * 1.5,
        vy: -Math.random() * 2,
        alpha: 1.0,
        color: Math.random() > 0.5 ? '#00f3ff' : '#ffb300'
      });
    }

    function render() {
      updatePhysics();

      ctx.fillStyle = '#050608';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (audioBuffer) {
        ctx.strokeStyle = 'rgba(0, 243, 255, 0.25)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        const data = audioBuffer.getChannelData(0);
        const step = Math.ceil(data.length / canvas.width);
        const amp = canvas.height / 3;

        for (let i = 0; i < canvas.width; i++) {
          const min = data[i * step] || 0;
          ctx.lineTo(i, canvas.height / 2 + min * amp);
        }
        ctx.stroke();
      }

      // Loop Range
      const startX = loopStart * canvas.width;
      const endX = loopEnd * canvas.width;
      ctx.fillStyle = 'rgba(0, 243, 255, 0.08)';
      ctx.fillRect(startX, 0, endX - startX, canvas.height);

      ctx.strokeStyle = '#00f3ff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(startX, 0); ctx.lineTo(startX, canvas.height);
      ctx.moveTo(endX, 0); ctx.lineTo(endX, canvas.height);
      ctx.stroke();

      // Playhead
      const headX = currentPos * canvas.width;
      ctx.strokeStyle = '#ffb300';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(headX, 0); ctx.lineTo(headX, canvas.height);
      ctx.stroke();

      // Walls
      ctx.strokeStyle = '#ff0055';
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';
      walls.forEach(w => {
        ctx.beginPath();
        ctx.moveTo(w.x1, w.y1);
        ctx.lineTo(w.x2, w.y2);
        ctx.stroke();
      });

      if (isDrawingWall && currentWallStart) {
        ctx.strokeStyle = 'rgba(255, 0, 85, 0.5)';
        ctx.beginPath();
        ctx.moveTo(currentWallStart.x, currentWallStart.y);
        ctx.lineTo(currentWallStart.lastX, currentWallStart.lastY);
        ctx.stroke();
      }

      // Balls
      balls.forEach(b => {
        ctx.fillStyle = '#ffb300';
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        ctx.fill();
      });

      // Particles
      for (let i = visualParticles.length - 1; i >= 0; i--) {
        const p = visualParticles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= 0.03;
        if (p.alpha <= 0) { visualParticles.splice(i, 1); continue; }
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.alpha;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1.0;
      }

      requestAnimationFrame(render);
    }
    requestAnimationFrame(render);

    // --- Pointer Controls (Continuous Touch Sequencer) ---
    canvas.addEventListener('pointerdown', (e) => {
      initAudio();
      const rect = canvas.getBoundingClientRect();
      touchX = e.clientX - rect.left;
      touchY = e.clientY - rect.top;
      isTouching = true;

      if (interactionMode === 'drop') {
        spawnBall(touchX, touchY);
        lastSpawnTime = performance.now();
      } else if (interactionMode === 'draw') {
        isDrawingWall = true;
        currentWallStart = { x: touchX, y: touchY, lastX: touchX, lastY: touchY };
      }
    });

    canvas.addEventListener('pointermove', (e) => {
      const rect = canvas.getBoundingClientRect();
      touchX = e.clientX - rect.left;
      touchY = e.clientY - rect.top;

      if (isDrawingWall && currentWallStart) {
        currentWallStart.lastX = touchX;
        currentWallStart.lastY = touchY;
      }
    });

    window.addEventListener('pointerup', () => {
      isTouching = false;
      if (isDrawingWall && currentWallStart) {
        walls.push({
          x1: currentWallStart.x,
          y1: currentWallStart.y,
          x2: currentWallStart.lastX,
          y2: currentWallStart.lastY
        });
        isDrawingWall = false;
        currentWallStart = null;
      }
    });

    // --- UI Controls Event Binding ---
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab, .tab-content').forEach(el => el.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById(tab.dataset.target).classList.add('active');
      });
    });

    document.getElementById('modeDrop').onclick = (e) => {
      interactionMode = 'drop';
      document.querySelectorAll('.btn-mode').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
    };

    document.getElementById('modeDraw').onclick = (e) => {
      interactionMode = 'draw';
      document.querySelectorAll('.btn-mode').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
    };

    document.getElementById('btnClearWalls').onclick = () => { walls = []; };
    document.getElementById('btnClearBalls').onclick = () => { balls = []; };

    document.getElementById('paramSize').oninput = (e) => {
      grainSize = e.target.value / 1000;
      document.getElementById('valSize').innerText = `${e.target.value}ms`;
    };

    document.getElementById('paramSpray').oninput = (e) => {
      spray = e.target.value / 100;
      document.getElementById('valSpray').innerText = `${e.target.value}%`;
    };

    document.getElementById('paramPitch').oninput = (e) => {
      playbackPitch = parseFloat(e.target.value);
      document.getElementById('valPitch').innerText = `${playbackPitch.toFixed(2)}x`;
    };

    document.getElementById('paramRate').oninput = (e) => {
      spawnRateMs = parseInt(e.target.value);
      document.getElementById('valRate').innerText = `${spawnRateMs}ms`;
    };

    document.getElementById('dirFwd').onclick = (e) => setDir('fwd', e.target);
    document.getElementById('dirRev').onclick = (e) => setDir('rev', e.target);
    document.getElementById('dirPing').onclick = (e) => setDir('ping', e.target);

    function setDir(dir, el) {
      playDirection = dir;
      document.querySelectorAll('#tabEngine .btn-opt').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
    }

    document.getElementById('paramStart').oninput = (e) => {
      loopStart = e.target.value / 100;
      if (loopStart >= loopEnd) loopStart = loopEnd - 0.05;
      document.getElementById('valStart').innerText = `${Math.round(loopStart * 100)}%`;
    };

    document.getElementById('paramEnd').oninput = (e) => {
      loopEnd = e.target.value / 100;
      if (loopEnd <= loopStart) loopEnd = loopStart + 0.05;
      document.getElementById('valEnd').innerText = `${Math.round(loopEnd * 100)}%`;
    };

    document.getElementById('selectKey').onchange = (e) => rootKey = parseInt(e.target.value);
    document.getElementById('selectScale').onchange = (e) => activeScale = SCALES[e.target.value];

    document.getElementById('paramFilter').oninput = (e) => {
      if (filterNode) filterNode.frequency.value = e.target.value;
      document.getElementById('valFilter').innerText = `${e.target.value}Hz`;
    };

    // File Import
    document.getElementById('btnFile').onclick = () => document.getElementById('fileInput').click();
    document.getElementById('fileInput').onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      initAudio();
      const reader = new FileReader();
      reader.onload = (evt) => {
        audioCtx.decodeAudioData(evt.target.result, (buf) => {
          audioBuffer = buf;
          currentPos = 0;
        });
      };
      reader.readAsArrayBuffer(file);
    };

    // Mic Recording (Cross-browser fix for iOS/Mobile)
    document.getElementById('btnMic').onclick = async () => {
      initAudio();
      const btn = document.getElementById('btnMic');

      if (!isRecording) {
        try {
          micStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
          
          let options = {};
          if (MediaRecorder.isTypeSupported('audio/webm')) {
            options.mimeType = 'audio/webm';
          } else if (MediaRecorder.isTypeSupported('audio/mp4')) {
            options.mimeType = 'audio/mp4';
          }

          mediaRecorder = new MediaRecorder(micStream, options);
          recordedChunks = [];

          mediaRecorder.ondataavailable = (e) => {
            if (e.data.size > 0) recordedChunks.push(e.data);
          };

          mediaRecorder.onstop = async () => {
            const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'audio/wav' });
            const arrayBuf = await blob.arrayBuffer();
            audioCtx.decodeAudioData(arrayBuf, (buf) => {
              audioBuffer = buf;
              currentPos = 0;
            });
          };

          mediaRecorder.start(100);
          isRecording = true;
          btn.innerText = 'STOP MIC';
          btn.classList.add('active');
        } catch (err) {
          alert('マイクの起動に失敗しました。ブラウザのマイク許可設定を確認してください。');
        }
      } else {
        mediaRecorder.stop();
        if (micStream) micStream.getTracks().forEach(track => track.stop());
        isRecording = false;
        btn.innerText = 'REC MIC';
        btn.classList.remove('active');
      }
    };
  </script>
</body>
</html>
