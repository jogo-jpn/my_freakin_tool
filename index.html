<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jogo.jpn - my freakin tools</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        :root {
            --mpc-body: #2b2b2b;
            --mpc-panel: #1f1f1f;
            --screen-bg: #0b1d1d;
            --screen-text: #00ffcc;
            --pad-bg: #383838;
            --pad-border: #4d4d4d;
            --pad-active: #ff9900;
            --accent: #ff9900;
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            background-color: #121212;
            color: #d0d0d0;
            font-family: 'Press Start 2P', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
        }

        .mpc-unit {
            background-color: var(--mpc-body);
            width: 100%;
            max-width: 480px; /* 画面が広い環境での最大幅 */
            padding: 20px 15px 25px 15px;
            border-radius: 10px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8), inset 0 2px 4px rgba(255,255,255,0.1);
            border-bottom: 6px solid #111;
            position: relative;
        }

        .top-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding: 0 5px;
        }

        .knob {
            width: 26px;
            height: 26px;
            background: #151515;
            border: 2px solid #444;
            border-radius: 50%;
            position: relative;
            box-shadow: 0 3px 5px rgba(0,0,0,0.5);
            flex-shrink: 0;
        }
        .knob::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 50%;
            transform: translateX(-50%);
            width: 3px;
            height: 8px;
            background: var(--accent);
            border-radius: 2px;
        }

        .logo-area {
            text-align: center;
            padding: 0 5px;
        }

        .brand {
            font-size: clamp(10px, 3.2vw, 13px);
            color: #fff;
            letter-spacing: 1px;
            font-weight: bold;
            white-space: nowrap;
        }

        .model {
            font-size: 6px;
            color: var(--accent);
            letter-spacing: 1px;
            margin-top: 2px;
        }

        .lcd-screen {
            background-color: var(--screen-bg);
            color: var(--screen-text);
            border: 2px solid #111;
            padding: 12px 10px;
            border-radius: 4px;
            text-align: center;
            box-shadow: inset 0 3px 8px rgba(0,0,0,0.8);
            margin-bottom: 20px;
            min-height: 75px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .lcd-title {
            font-size: clamp(9px, 2.8vw, 12px);
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .lcd-subtitle {
            font-size: 6px;
            line-height: 1.5;
            color: #88eedd;
        }

        /* MPCスタイル 16パッド（ポータル仕様） */
        .pad-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            background: var(--mpc-panel);
            padding: 10px;
            border-radius: 6px;
            border: 2px solid #151515;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        }

        .pad {
            background-color: var(--pad-bg);
            border: 2px solid var(--pad-border);
            border-radius: 4px;
            min-height: 52px;
            aspect-ratio: 1 / 1;
            padding: 4px 2px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            color: #aaa;
            font-family: 'Press Start 2P', monospace;
            font-size: clamp(6px, 1.8vw, 8px);
            box-shadow: 0 3px 0 #111, inset 0 1px 2px rgba(255,255,255,0.1);
            transition: transform 0.1s, box-shadow 0.1s;
            position: relative;
            overflow: hidden;
            word-break: break-word;
            cursor: pointer;
        }

        /* 左上のパッド（SLICE BOY） */
        .pad.active-tool {
            background-color: #3d2414;
            border-color: var(--accent);
            color: #fff;
            box-shadow: 0 3px 0 #b36b00, inset 0 1px 2px rgba(255,153,0,0.3);
        }

        .pad.active-tool:hover {
            background-color: var(--accent);
            color: #121212;
        }
 
        .pad.active-tool:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #b36b00;
        }

        .pad span {
            font-size: clamp(5px, 1.5vw, 8px);
            color: #666;
            margin-top: 2px;
            text-align: center;
            line-height: 1.1;
        }

        .pad.active-tool span {
            color: #ffaa33;
        }
        .pad.active-tool:hover span {
            color: #121212;
        }

        .pad.coming-soon {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .meta-info {
            margin-top: 15px;
            font-size: 8px;
            text-align: center;
            color: #666;
            letter-spacing: 1px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="mpc-unit">
        <div class="top-panel">
            <div class="knob"></div>
            <div class="logo-area">
                <div class="brand">MY FREKIN TOOL</div>
            </div>
            <div class="knob"></div>
        </div>

        <div class="lcd-screen">
            <div class="lcd-title">&gt;&gt; SELECT A TOOL &lt;&lt;</div>
        </div>

        <!-- 16パッド：左上（Pad 1）がリンク、他はCOMING SOON -->
        <div class="pad-grid">
            <!-- PAD 1: SLICE BOY (リンクあり) -->
            <a href="https://jogo-jpn.github.io/SLICE_BOY/" class="pad active-tool">
                PAD 1
                <span>SLICE BOY</span>
                <span>beta</span>
            </a>
            
            <a href="https://jogo-jpn.github.io/Lofi_box/" class="pad active-tool">
                PAD 2
                <span>LOFI BOX</span>
                <span></span>
            </a>

            <!-- PAD 3〜16: Coming Soon -->
            <a href="https://jogo-jpn.github.io/super_eselator/" class="pad active-tool">
                PAD 3
                <span>SUPER</span>
                <span>ESELATOR</span>
            </a>
            <div class="pad coming-soon">PAD 4<span>SOON</span></div>
            
            <div class="pad coming-soon">PAD 5<span>SOON</span></div>
            <div class="pad coming-soon">PAD 6<span>SOON</span></div>
            <div class="pad coming-soon">PAD 7<span>SOON</span></div>
            <div class="pad coming-soon">PAD 8<span>SOON</span></div>
            
            <div class="pad coming-soon">PAD 9<span>SOON</span></div>
            <div class="pad coming-soon">PAD 10<span>SOON</span></div>
            <div class="pad coming-soon">PAD 11<span>SOON</span></div>
            <div class="pad coming-soon">PAD 12<span>SOON</span></div>
            
            <div class="pad coming-soon">PAD 13<span>SOON</span></div>
            <div class="pad coming-soon">PAD 14<span>SOON</span></div>
            <div class="pad coming-soon">PAD 15<span>SOON</span></div>
            <div class="pad coming-soon">PAD 16<span>SOON</span></div>
        </div>

        <div class="meta-info">
            STARTED IN 2026 / by jogo.jpn
        </div>
        <div class="meta-info">
            update:202609261854
        </div>
    </div>

    <script>
        let audioCtx = null;

        // ファミコン風決定音（ピロリン♪）を発音する関数
        function playFamicomSelectSound() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const now = audioCtx.currentTime;

            // オシレーター（発振器）作成
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            // ファミコン特有の「矩形波（square）」を設定
            osc.type = 'square';

            // 音圧の減衰設定（フェードアウト）
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);

            // 1音目: B5 (約987Hz) ➔ 2音目: E6 (約1318Hz) への素早い周波数変化
            osc.frequency.setValueAtTime(987.77, now);
            osc.frequency.setValueAtTime(1318.51, now + 0.05);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start(now);
            osc.stop(now + 0.15);
        }

        // アクティブなパッド（ボタン）にクリックイベントを設定
        document.querySelectorAll('.pad.active-tool').forEach(button => {
            button.addEventListener('click', function(e) {
                e.preventDefault(); // 一旦デフォルトの遷移を止める
                
                playFamicomSelectSound();

                const targetUrl = this.getAttribute('href');
                
                // 音が鳴り終わるタイミング（約120ms後）でページ移動
                setTimeout(() => {
                    window.location.href = targetUrl;
                }, 120);
            });
        });
    </script>
</body>
</html>
