<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8e8ef"/>
      <stop offset="52%" stop-color="#c8c8d0"/>
      <stop offset="100%" stop-color="#aaa7b8"/>
    </linearGradient>

    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#172a19"/>
      <stop offset="100%" stop-color="#061008"/>
    </linearGradient>

    <linearGradient id="purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c80ca"/>
      <stop offset="100%" stop-color="#5c417f"/>
    </linearGradient>

    <linearGradient id="darkKey" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a5764"/>
      <stop offset="100%" stop-color="#302e39"/>
    </linearGradient>

    <pattern id="scanlines" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="4" fill="transparent"/>
      <rect y="4" width="8" height="4" fill="#000" opacity=".18"/>
    </pattern>

    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity=".7"/>
    </filter>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .title {
        font-family: Arial, sans-serif;
        font-weight: 900;
        letter-spacing: 5px;
      }

      .mono {
        font-family: monospace;
      }

      .section {
        font-family: monospace;
        font-size: 19px;
        font-weight: bold;
        fill: #b9f8cc;
      }

      .detail {
        font-family: monospace;
        font-size: 12px;
        font-weight: bold;
        fill: #7bc991;
      }

      .head {
        font-family: monospace;
        font-size: 14px;
        font-weight: bold;
        fill: #a8f5bf;
      }

      .combo {
        font-family: monospace;
        font-size: 14px;
        font-weight: bold;
        fill: #ffffff;
      }

      .action {
        font-family: monospace;
        font-size: 14px;
        font-weight: bold;
        fill: #d5ffe2;
      }

      .hint {
        font-family: monospace;
        font-size: 11px;
        font-weight: bold;
        fill: #86d69e;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1350" fill="#090a0e"/>

  <!-- ESELATOR console shell -->
  <rect x="48" y="42" width="984" height="1265" rx="42"
        fill="url(#shell)" stroke="#85828f" stroke-width="5" filter="url(#shadow)"/>
  <rect x="68" y="62" width="944" height="1225" rx="28"
        fill="none" stroke="#ffffff" stroke-opacity=".42" stroke-width="3"/>

  <!-- Header -->
  <text x="94" y="115" class="title" font-size="35" fill="#282536">
    SUPER ESELATOR
  </text>

  <text x="96" y="144" class="mono" font-size="15" font-weight="bold" fill="#5f2b80">
    GAMEPAD PERFORMANCE GUIDE
  </text>

  <rect x="820" y="87" width="155" height="43" rx="7"
        fill="url(#purple)" stroke="#aa8bd0" stroke-width="2"/>
  <circle cx="842" cy="108" r="7" fill="#c5a5f3" filter="url(#glow)"/>
  <text x="859" y="114" class="mono" font-size="14" font-weight="bold" fill="#ffffff">
    GAMEPAD
  </text>

  <!-- CRT Panel -->
  <rect x="78" y="180" width="924" height="1040" rx="18"
        fill="#282530" stroke="#46414e" stroke-width="4"/>

  <rect x="96" y="198" width="888" height="1004" rx="12"
        fill="url(#screen)" stroke="#050805" stroke-width="5"/>

  <rect x="96" y="198" width="888" height="1004" rx="12"
        fill="url(#scanlines)" opacity=".58"/>

  <!-- CRT Header -->
  <circle cx="132" cy="240" r="8" fill="#22ff55" filter="url(#glow)"/>

  <text x="151" y="247" class="mono" font-size="18" font-weight="bold" fill="#bcf8cf">
    GAMEPAD CONTROL MAP
  </text>

  <text x="947" y="247" class="mono" font-size="14" text-anchor="end" fill="#f8e56b">
    READY
  </text>

  <line x1="125" y1="275" x2="955" y2="275"
        stroke="#2b8650" stroke-width="2" opacity=".7"/>

  <!-- Table title -->
  <text x="125" y="318" class="section">ALL CONTROLS</text>
  <text x="125" y="341" class="detail">
    GAMEPAD BUTTONS / DIRECTIONAL INPUT / SELECT COMBOS
  </text>

  <!-- Table header -->
  <rect x="125" y="360" width="830" height="38" rx="6"
        fill="#263a2b" stroke="#388957" stroke-width="1"/>

  <text x="155" y="385" class="head">INPUT</text>
  <text x="435" y="385" class="head">FUNCTION</text>

  <!-- Row helper: alternate #0c2011 / #102615 -->

  <!-- 1 -->
  <rect x="125" y="400" width="830" height="35" fill="#0c2011" stroke="#1d5833"/>
  <text x="155" y="423" class="combo">L</text>
  <text x="435" y="423" class="action">DECK SELECT</text>

  <!-- 2 -->
  <rect x="125" y="436" width="830" height="35" fill="#102615" stroke="#1d5833"/>
  <text x="155" y="459" class="combo">R</text>
  <text x="435" y="459" class="action">REC / STOP / OVERDUB</text>

  <!-- 3 -->
  <rect x="125" y="472" width="830" height="35" fill="#0c2011" stroke="#1d5833"/>
  <text x="155" y="495" class="combo">UP</text>
  <text x="435" y="495" class="action">SCALE NOTE 1</text>

  <!-- 4 -->
  <rect x="125" y="508" width="830" height="35" fill="#102615" stroke="#1d5833"/>
  <text x="155" y="531" class="combo">UP-RIGHT</text>
  <text x="435" y="531" class="action">SCALE NOTE 2</text>

  <!-- 5 -->
  <rect x="125" y="544" width="830" height="35" fill="#0c2011" stroke="#1d5833"/>
  <text x="155" y="567" class="combo">RIGHT</text>
  <text x="435" y="567" class="action">SCALE NOTE 3</text>

  <!-- 6 -->
  <rect x="125" y="580" width="830" height="35" fill="#102615" stroke="#1d5833"/>
  <text x="155" y="603" class="combo">DOWN-RIGHT</text>
  <text x="435" y="603" class="action">SCALE NOTE 4</text>

  <!-- 7 -->
  <rect x="125" y="616" width="830" height="35" fill="#0c2011" stroke="#1d5833"/>
  <text x="155" y="639" class="combo">DOWN</text>
  <text x="435" y="639" class="action">SCALE NOTE 5</text>

  <!-- 8 -->
  <rect x="125" y="652" width="830" height="35" fill="#102615" stroke="#1d5833"/>
  <text x="155" y="675" class="combo">DOWN-LEFT</text>
  <text x="435" y="675" class="action">SCALE NOTE 6</text>

  <!-- 9 -->
  <rect x="125" y="688" width="830" height="35" fill="#0c2011" stroke="#1d5833"/>
  <text x="155" y="711" class="combo">LEFT</text>
  <text x="435" y="711" class="action">SCALE NOTE 7</text>

  <!-- 10 -->
  <rect x="125" y="724" width="830" height="35" fill="#102615" stroke="#1d5833"/>
  <text x="155" y="747" class="combo">UP-LEFT</text>
  <text x="435" y="747" class="action">SCALE NOTE 8</text>

  <!-- 11 -->
  <rect x="125" y="760" width="830" height="35" fill="#0c2011" stroke="#1d5833"/>
  <text x="155" y="783" class="combo">A</text>
  <text x="435" y="783" class="action">OCTAVE UP</text>

  <!-- 12 -->
  <rect x="125" y="796" width="830" height="35" fill="#102615" stroke="#1d5833"/>
  <text x="155" y="819" class="combo">B</text>
  <text x="435" y="819" class="action">OCTAVE DOWN</text>

  <!-- 13 -->
  <rect x="125" y="832" width="830" height="35" fill="#0c2011" stroke="#1d5833"/>
  <text x="155" y="855" class="combo">X</text>
  <text x="435" y="855" class="action">CLEAR ACTIVE DECK</text>

  <!-- 14 -->
  <rect x="125" y="868" width="830" height="35" fill="#102615" stroke="#1d5833"/>
  <text x="155" y="891" class="combo">Y</text>
  <text x="435" y="891" class="action">FX ON / OFF</text>

  <!-- 15 -->
  <rect x="125" y="904" width="830" height="35" fill="#0c2011" stroke="#1d5833"/>
  <text x="155" y="927" class="combo">START</text>
  <text x="435" y="927" class="action">PLAY / STOP</text>

  <!-- Select combo divider -->
  <rect x="125" y="954" width="830" height="34" rx="6"
        fill="#432c61" stroke="#a987d0" stroke-width="1"/>

  <text x="155" y="977" class="mono" font-size="14" font-weight="bold" fill="#efe4ff">
    SELECT + COMBO
  </text>

  <text x="435" y="977" class="mono" font-size="12" font-weight="bold" fill="#dfc8ff">
    HOLD SELECT FOR EXTENDED CONTROLS
  </text>

  <!-- 16 -->
  <rect x="125" y="990" width="830" height="35" fill="#0c2011" stroke="#1d5833"/>
  <text x="155" y="1013" class="combo">SELECT + L</text>
  <text x="435" y="1013" class="action">NEXT SOUND</text>

  <!-- 17 -->
  <rect x="125" y="1026" width="830" height="35" fill="#102615" stroke="#1d5833"/>
  <text x="155" y="1049" class="combo">SELECT + R</text>
  <text x="435" y="1049" class="action">PREVIOUS SOUND</text>

  <!-- 18 -->
  <rect x="125" y="1062" width="830" height="35" fill="#0c2011" stroke="#1d5833"/>
  <text x="155" y="1085" class="combo">SELECT + A</text>
  <text x="435" y="1085" class="action">MUTE DECK A</text>

  <!-- 19 -->
  <rect x="125" y="1098" width="830" height="35" fill="#102615" stroke="#1d5833"/>
  <text x="155" y="1121" class="combo">SELECT + B</text>
  <text x="435" y="1121" class="action">MUTE DECK B</text>

  <!-- 20 -->
  <rect x="125" y="1134" width="830" height="35" fill="#0c2011" stroke="#1d5833"/>
  <text x="155" y="1157" class="combo">SELECT + X</text>
  <text x="435" y="1157" class="action">MUTE DECK C</text>

  <!-- 21 -->
  <rect x="125" y="1170" width="830" height="35" fill="#102615" stroke="#1d5833"/>
  <text x="155" y="1193" class="combo">SELECT + Y</text>
  <text x="435" y="1193" class="action">MUTE DECK D</text>

  <!-- Footer outside CRT -->
  <text x="540" y="1262" class="title" font-size="16" text-anchor="middle" fill="#3b3747">
    SUPER ESELATOR / GAMEPAD LIVE PERFORMANCE
  </text>
</svg>
```