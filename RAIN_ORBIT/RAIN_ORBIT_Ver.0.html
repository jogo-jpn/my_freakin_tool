<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>RAIN ORBIT</title>
  <style>
    :root {
      --bg-0: #070b12;
      --bg-1: #0b1120;
      --panel: rgba(10, 14, 22, 0.72);
      --panel-strong: rgba(12, 17, 27, 0.88);
      --border: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.16);
      --text: #eaf1f8;
      --sub: #91a3b7;
      --accent: #8be9ff;
      --accent-2: #a78bfa;
      --danger: #ff5d7a;
      --shadow: 0 12px 34px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(circle at 20% 10%, rgba(139, 233, 255, 0.10), transparent 24%),
        radial-gradient(circle at 80% 20%, rgba(167, 139, 250, 0.08), transparent 26%),
        linear-gradient(180deg, var(--bg-1), var(--bg-0));
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      touch-action: none;
    }

    #canvas-container {
      position: absolute;
      inset: 0;
      z-index: 1;
      cursor: crosshair;
      touch-action: none;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    button, select, input[type="color"] {
      appearance: none;
      -webkit-appearance: none;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      border-radius: 10px;
      padding: 7px 11px;
      font-size: 13px;
      line-height: 1;
      outline: none;
      transition: 0.18s ease;
      cursor: pointer;
      font: inherit;
      touch-action: manipulation;
    }

    button:hover, select:hover, input[type="color"]:hover {
      border-color: var(--border-strong);
      background: rgba(255, 255, 255, 0.08);
    }

    button:focus, select:focus, input[type="color"]:focus {
      border-color: rgba(139, 233, 255, 0.5);
      box-shadow: 0 0 0 3px rgba(139, 233, 255, 0.10);
    }

    button:disabled, select:disabled, input[type="color"]:disabled, input[type="range"]:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    input[type="color"] {
      min-width: 0;
      width: 100%;
      height: 34px;
      padding: 4px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.05);
    }

    input[type="color"]::-webkit-color-swatch-wrapper {
      padding: 0;
    }

    input[type="color"]::-webkit-color-swatch {
      border: none;
      border-radius: 6px;
    }

    .menu-toggle {
      position: fixed;
      top: calc(14px + env(safe-area-inset-top));
      right: calc(14px + env(safe-area-inset-right));
      z-index: 30;
      width: 52px;
      height: 52px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      font-size: 20px;
      font-weight: 700;
      background: rgba(10, 14, 22, 0.68);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .menu-toggle:hover {
      transform: translateY(-1px);
      border-color: var(--border-strong);
    }

    .settings-overlay {
      position: fixed;
      inset: 0;
      z-index: 18;
      background: rgba(0, 0, 0, 0.24);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
      opacity: 0;
      pointer-events: none;
      transition: 0.18s ease;
    }

    .settings-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .settings-panel {
      position: fixed;
      right: calc(14px + env(safe-area-inset-right));
      top: calc(74px + env(safe-area-inset-top));
      z-index: 25;
      width: min(392px, calc(100vw - 28px));
      max-height: min(78vh, 760px);
      overflow: auto;
      padding: 14px;
      border-radius: 18px;
      background: var(--panel-strong);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      opacity: 0;
      transform: translateY(12px) scale(0.98);
      pointer-events: none;
      visibility: hidden;
      transition: 0.18s ease;
    }

    .settings-panel.open {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
      visibility: visible;
    }

    .settings-panel::-webkit-scrollbar {
      width: 10px;
    }

    .settings-panel::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.14);
      border-radius: 999px;
      border: 2px solid transparent;
      background-clip: padding-box;
    }

    .settings-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }

    .settings-title {
      display: flex;
      flex-direction: column;
      gap: 2px;
      line-height: 1.1;
    }

    .settings-title strong {
      font-size: 14px;
      letter-spacing: 0.18em;
      font-weight: 700;
      color: var(--text);
    }

    .settings-title span {
      font-size: 10px;
      color: var(--sub);
      letter-spacing: 0.08em;
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      padding: 0;
      display: grid;
      place-items: center;
      font-size: 18px;
      line-height: 1;
    }

    .settings-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 12px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      margin-bottom: 10px;
    }

    .settings-section-title {
      font-size: 11px;
      color: var(--accent);
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .control-row,
    .slider-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .control-row label,
    .slider-row label {
      min-width: 86px;
      font-size: 11px;
      color: var(--sub);
      white-space: nowrap;
    }

    .control-row select,
    .slider-row select {
      flex: 1;
      min-width: 0;
      width: 100%;
    }

    .control-row input[type="color"] {
      flex: 1;
      min-width: 0;
      width: 100%;
    }

    .slider-row input[type="range"] {
      flex: 1;
      min-width: 0;
      accent-color: var(--accent);
    }

    .slider-value {
      min-width: 46px;
      text-align: right;
      font-size: 11px;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }

    .sound-legend {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      color: var(--sub);
    }

    .legend-swatch {
      width: 14px;
      height: 14px;
      border-radius: 999px;
      box-shadow: 0 0 10px currentColor;
      flex: 0 0 auto;
    }

    .legend-note {
      font-size: 11px;
      color: var(--sub);
      line-height: 1.5;
    }

    .action-bar {
      position: fixed;
      left: 50%;
      bottom: calc(14px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 20;
      width: min(1080px, calc(100vw - 28px));
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex-wrap: nowrap;
      overflow-x: auto;
      overflow-y: hidden;
      background: rgba(10, 14, 22, 0.72);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      scrollbar-width: none;
    }

    .action-bar::-webkit-scrollbar {
      display: none;
    }

    .action-bar button {
      flex: 0 0 auto;
      white-space: nowrap;
    }

    button.btn-rec {
      position: relative;
      padding-left: 30px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    button.btn-rec::before {
      content: "";
      position: absolute;
      left: 11px;
      top: 50%;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      transform: translateY(-50%);
      background: var(--danger);
      box-shadow: 0 0 10px rgba(255, 93, 122, 0.55);
    }

    button.btn-rec.recording {
      border-color: rgba(255, 93, 122, 0.55);
      background: rgba(255, 93, 122, 0.12);
      color: #ff8ea1;
    }

    .rec-time-display {
      min-width: 52px;
      font-size: 12px;
      font-weight: 700;
      color: #ff8ea1;
      display: none;
      font-variant-numeric: tabular-nums;
      align-self: center;
      text-align: center;
      padding: 0 4px;
    }

    .instructions {
      position: absolute;
      left: calc(16px + env(safe-area-inset-left));
      bottom: calc(92px + env(safe-area-inset-bottom));
      z-index: 5;
      color: rgba(234, 241, 248, 0.42);
      font-size: 12px;
      line-height: 1.65;
      pointer-events: none;
      text-shadow: 0 1px 10px rgba(0, 0, 0, 0.4);
      max-width: min(320px, calc(100vw - 90px));
    }

    @media (max-width: 720px) {
      .settings-panel {
        left: 14px;
        right: 14px;
        width: auto;
        top: calc(74px + env(safe-area-inset-top));
        max-height: min(72vh, 700px);
      }

      .control-row label,
      .slider-row label {
        min-width: 72px;
      }

      .action-bar {
        justify-content: flex-start;
        width: calc(100vw - 16px);
        padding: 10px 12px;
      }

      .instructions {
        max-width: calc(100vw - 32px);
      }
    }
  </style>
</head>
<body>
  <div id="canvas-container">
    <canvas id="mainCanvas"></canvas>
  </div>

  <button id="menuToggle" class="menu-toggle" aria-label="設定">⚙</button>

  <div id="settingsOverlay" class="settings-overlay"></div>

  <div id="settingsPanel" class="settings-panel" aria-hidden="true">
    <div class="settings-header">
      <div class="settings-title">
        <strong>RAIN ORBIT</strong>
        <span>線の3色で ambient pad が変化</span>
      </div>
      <button id="closeMenuBtn" class="icon-btn" aria-label="閉じる">×</button>
    </div>

    <div class="settings-section">
      <div class="settings-section-title">色設定</div>

      <div class="control-row">
        <label for="lineColorModeSelect">線の色</label>
        <select id="lineColorModeSelect">
          <option value="random" selected>ランダム</option>
          <option value="manual">マニュアル</option>
        </select>
      </div>

      <div class="control-row">
        <label for="lineColorSelect">線色(手動)</label>
        <select id="lineColorSelect">
          <option value="0">Cyan</option>
          <option value="1">Violet</option>
          <option value="2">Mint</option>
        </select>
      </div>

      <div class="control-row">
        <label for="ballColorModeSelect">玉の色</label>
        <select id="ballColorModeSelect">
          <option value="random" selected>ランダム</option>
          <option value="manual">マニュアル</option>
        </select>
      </div>

      <div class="control-row">
        <label for="ballColorInput">玉色(手動)</label>
        <input type="color" id="ballColorInput" value="#8be9ff" />
      </div>

      <div class="slider-row">
        <label for="ballSizeSlider">玉サイズ</label>
        <input type="range" id="ballSizeSlider" min="4" max="30" step="1" value="10" />
        <span id="ballSizeVal" class="slider-value">10px</span>
      </div>
    </div>

    <div class="settings-section">
      <div class="settings-section-title">音階</div>
      <div class="control-row">
        <label for="keySelect">Key</label>
        <select id="keySelect">
          <option value="C">C</option>
          <option value="C#">C# / Db</option>
          <option value="D">D</option>
          <option value="D#">Eb</option>
          <option value="E">E</option>
          <option value="F">F</option>
          <option value="F#">F# / Gb</option>
          <option value="G">G</option>
          <option value="G#">Ab</option>
          <option value="A" selected>A</option>
          <option value="A#">Bb</option>
          <option value="B">B</option>
        </select>
      </div>

      <div class="control-row">
        <label for="scaleSelect">Scale</label>
        <select id="scaleSelect">
          <option value="majorPentatonic">Major Pentatonic</option>
          <option value="minorPentatonic" selected>Minor Pentatonic</option>
          <option value="major">Major</option>
          <option value="minor">Minor</option>
          <option value="hirajoshi">Hirajoshi</option>
          <option value="akebono">Akebono</option>
          <option value="lydian">Lydian</option>
          <option value="dorian">Dorian</option>
        </select>
      </div>
    </div>

    <div class="settings-section">
      <div class="settings-section-title">重力</div>
      <div class="control-row">
        <label for="gravityModeSelect">重力モード</label>
        <select id="gravityModeSelect">
          <option value="manual" selected>通常（下方向）</option>
          <option value="sensor">iPhone重力センサー</option>
        </select>
      </div>

      <div class="control-row">
        <button id="sensorBtn" style="width: 100%;">センサー許可</button>
      </div>

      <div class="slider-row">
        <label for="gravitySlider">重力</label>
        <input type="range" id="gravitySlider" min="0.00" max="1.50" step="0.05" value="0.45" />
        <span id="gravityVal" class="slider-value">0.45</span>
      </div>

      <div class="slider-row">
        <label for="bounceSlider">反発</label>
        <input type="range" id="bounceSlider" min="0.10" max="0.98" step="0.01" value="0.68" />
        <span id="bounceVal" class="slider-value">0.68</span>
      </div>

      <div class="slider-row">
        <label for="bounceLimitSlider">バウンド上限</label>
        <input type="range" id="bounceLimitSlider" min="1" max="50" step="1" value="10" />
        <span id="bounceLimitVal" class="slider-value">10回</span>
      </div>
    </div>

    <div class="settings-section">
      <div class="settings-section-title">線の色 / 音色</div>
      <div class="sound-legend">
        <div class="legend-item"><span class="legend-swatch" style="background:#8be9ff; color:#8be9ff;"></span> Cyan → Mist Pad</div>
        <div class="legend-item"><span class="legend-swatch" style="background:#b6a3ff; color:#b6a3ff;"></span> Violet → Dawn Pad</div>
        <div class="legend-item"><span class="legend-swatch" style="background:#7ee0c1; color:#7ee0c1;"></span> Mint → Aurora Pad</div>
      </div>
      <div class="legend-note">新しい線は 3 色で切り替わり、各色に対応した ambient 寄りの pad 音色になります。</div>
    </div>
  </div>

  <div class="action-bar">
    <button id="recBtn" class="btn-rec">START REC</button>
    <div id="recTimeDisplay" class="rec-time-display">待機</div>
    <button id="undoBtn">UNDO</button>
    <button id="clearLinesBtn">線消去</button>
    <button id="clearBallsBtn">玉消去</button>
    <button id="clearLoopBtn">録音消去</button>
  </div>

  <div class="instructions">
    ・画面をドラッグして線を描く<br />
    ・タップすると玉を発生<br />
    ・⚙で設定ウインドウを開く<br />
    ・線/玉の色はランダム or マニュアルで変更可能<br />
    ・玉サイズも調整可能<br />
    ・録音は最初の玉が出た瞬間から開始
  </div>

  <script>
    const NOTE_NAMES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];

    const SCALES = {
      majorPentatonic: [0, 2, 4, 7, 9],
      minorPentatonic: [0, 3, 5, 7, 10],
      major: [0, 2, 4, 5, 7, 9, 11],
      minor: [0, 2, 3, 5, 7, 8, 10],
      hirajoshi: [0, 2, 3, 7, 8],
      akebono: [0, 2, 3, 7, 9],
      lydian: [0, 2, 4, 6, 7, 9, 11],
      dorian: [0, 2, 3, 5, 7, 9, 10]
    };

    const BALL_COLORS = ["#8be9ff", "#b6a3ff", "#7ee0c1", "#ffd27a"];

    const LINE_STYLES = [
      { color: "#8be9ff", soundPreset: "mist", name: "Mist Pad" },
      { color: "#b6a3ff", soundPreset: "dawn", name: "Dawn Pad" },
      { color: "#7ee0c1", soundPreset: "aurora", name: "Aurora Pad" }
    ];

    const PAD_PRESETS = {
      mist: {
        partials: [
          { type: "sine", mult: 1, detune: -8, gain: 0.92 },
          { type: "triangle", mult: 2, detune: 4, gain: 0.26 },
          { type: "sine", mult: 0.5, detune: 0, gain: 0.16 }
        ],
        cutoffMul: 5.0,
        cutoffTail: 2.0,
        attack: 0.08,
        release: 2.9,
        volume: 0.20,
        delayTime: 0.18,
        wet: 0.16,
        feedback: 0.14,
        fbCutoff: 1800,
        pan: -0.18,
        panSpread: 0.20
      },
      dawn: {
        partials: [
          { type: "triangle", mult: 1, detune: -6, gain: 0.85 },
          { type: "sine", mult: 1.5, detune: 6, gain: 0.24 },
          { type: "sine", mult: 2, detune: 11, gain: 0.14 }
        ],
        cutoffMul: 4.0,
        cutoffTail: 1.6,
        attack: 0.10,
        release: 3.2,
        volume: 0.19,
        delayTime: 0.24,
        wet: 0.18,
        feedback: 0.17,
        fbCutoff: 1600,
        pan: 0.10,
        panSpread: 0.22
      },
      aurora: {
        partials: [
          { type: "sine", mult: 1, detune: -3, gain: 0.82 },
          { type: "triangle", mult: 2, detune: 9, gain: 0.20 },
          { type: "sine", mult: 3, detune: 0, gain: 0.10 }
        ],
        cutoffMul: 6.0,
        cutoffTail: 2.4,
        attack: 0.05,
        release: 2.6,
        volume: 0.18,
        delayTime: 0.30,
        wet: 0.20,
        feedback: 0.19,
        fbCutoff: 2000,
        pan: 0.18,
        panSpread: 0.24
      }
    };

    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === "suspended") {
        audioCtx.resume();
      }
    }

    function clamp(v, min, max) {
      return Math.max(min, Math.min(max, v));
    }

    function midiToFreq(midi) {
      return 440 * Math.pow(2, (midi - 69) / 12);
    }

    function getScaleNotes(keyName, scaleName, octaveStart = 3, octaveCount = 4) {
      const keyIndex = NOTE_NAMES.indexOf(keyName);
      const intervals = SCALES[scaleName] || SCALES.minorPentatonic;
      const freqs = [];

      for (let oct = 0; oct < octaveCount; oct++) {
        for (let i = 0; i < intervals.length; i++) {
          const midi = 12 * (octaveStart + oct + 1) + keyIndex + intervals[i];
          freqs.push(midiToFreq(midi));
        }
      }
      return freqs;
    }

    function playAmbientPad(freq, velocity = 1.0, presetKey = "mist") {
      if (!audioCtx) return;

      const preset = PAD_PRESETS[presetKey] || PAD_PRESETS.mist;
      const now = audioCtx.currentTime;

      const master = audioCtx.createGain();
      master.gain.value = 0.9;
      master.connect(audioCtx.destination);

      const dryGain = audioCtx.createGain();
      const wetGain = audioCtx.createGain();
      dryGain.gain.value = 1 - preset.wet;
      wetGain.gain.value = preset.wet;

      const mix = audioCtx.createGain();
      mix.gain.value = 0.30;

      const hp = audioCtx.createBiquadFilter();
      hp.type = "highpass";
      hp.frequency.setValueAtTime(70, now);

      const lp = audioCtx.createBiquadFilter();
      lp.type = "lowpass";
      lp.frequency.setValueAtTime(clamp(freq * preset.cutoffMul * (1 + velocity * 0.12), 700, 8000), now);
      lp.frequency.exponentialRampToValueAtTime(clamp(freq * preset.cutoffTail * (1 + velocity * 0.05), 500, 6000), now + preset.release);

      const env = audioCtx.createGain();
      const vol = clamp(velocity, 0.15, 1.0) * preset.volume;
      env.gain.setValueAtTime(0.0001, now);
      env.gain.exponentialRampToValueAtTime(vol, now + preset.attack);
      env.gain.exponentialRampToValueAtTime(0.0001, now + preset.release);

      const delay = audioCtx.createDelay(2.0);
      delay.delayTime.setValueAtTime(preset.delayTime, now);

      const fbFilter = audioCtx.createBiquadFilter();
      fbFilter.type = "lowpass";
      fbFilter.frequency.setValueAtTime(preset.fbCutoff, now);

      const fbGain = audioCtx.createGain();
      fbGain.gain.setValueAtTime(preset.feedback, now);

      const canPan = typeof audioCtx.createStereoPanner === "function";
      const panner = canPan ? audioCtx.createStereoPanner() : null;
      if (panner) {
        const pan = clamp(preset.pan + (Math.random() - 0.5) * preset.panSpread, -0.85, 0.85);
        panner.pan.setValueAtTime(pan, now);
      }

      mix.connect(hp);
      hp.connect(lp);
      lp.connect(env);

      if (panner) {
        env.connect(panner);
        panner.connect(dryGain);
        panner.connect(delay);
      } else {
        env.connect(dryGain);
        env.connect(delay);
      }

      delay.connect(wetGain);
      delay.connect(fbFilter);
      fbFilter.connect(fbGain);
      fbGain.connect(delay);

      dryGain.connect(master);
      wetGain.connect(master);

      const cleanupNodes = () => {
        try { master.disconnect(); } catch {}
        try { dryGain.disconnect(); } catch {}
        try { wetGain.disconnect(); } catch {}
        try { mix.disconnect(); } catch {}
        try { hp.disconnect(); } catch {}
        try { lp.disconnect(); } catch {}
        try { env.disconnect(); } catch {}
        try { delay.disconnect(); } catch {}
        try { fbFilter.disconnect(); } catch {}
        try { fbGain.disconnect(); } catch {}
        if (panner) {
          try { panner.disconnect(); } catch {}
        }
      };

      preset.partials.forEach((partial) => {
        const osc = audioCtx.createOscillator();
        const oscGain = audioCtx.createGain();

        osc.type = partial.type;
        osc.frequency.setValueAtTime(freq * (partial.mult || 1), now);
        osc.detune.setValueAtTime(partial.detune || 0, now);
        oscGain.gain.value = partial.gain ?? 1;

        osc.connect(oscGain);
        oscGain.connect(mix);

        osc.start(now);
        osc.stop(now + preset.release + 1.0);

        setTimeout(() => {
          try { osc.disconnect(); } catch {}
          try { oscGain.disconnect(); } catch {}
        }, (preset.release + 1.5) * 1000);
      });

      setTimeout(cleanupNodes, (preset.release + 3.0) * 1000);
    }

    const canvas = document.getElementById("mainCanvas");
    const ctx = canvas.getContext("2d");

    let width = 0;
    let height = 0;
    let dpr = 1;

    function resizeCanvas() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;

      canvas.width = Math.floor(width * dpr);
      canvas.height = Math.floor(height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    let lines = [];
    let currentLine = null;
    let balls = [];
    let activeFreqs = [];
    let historyStack = [];

    let isRecording = false;
    let recStartTime = null;
    let loopDuration = 0;
    let recordedEvents = [];
    let activeLoopTimeouts = [];

    const menuToggle = document.getElementById("menuToggle");
    const settingsPanel = document.getElementById("settingsPanel");
    const settingsOverlay = document.getElementById("settingsOverlay");
    const closeMenuBtn = document.getElementById("closeMenuBtn");

    function setSettingsOpen(open) {
      settingsPanel.classList.toggle("open", open);
      settingsOverlay.classList.toggle("open", open);
      settingsPanel.setAttribute("aria-hidden", open ? "false" : "true");
    }

    menuToggle.addEventListener("click", () => {
      setSettingsOpen(!settingsPanel.classList.contains("open"));
    });

    closeMenuBtn.addEventListener("click", () => setSettingsOpen(false));
    settingsOverlay.addEventListener("click", () => setSettingsOpen(false));

    const lineColorModeSelect = document.getElementById("lineColorModeSelect");
    const lineColorSelect = document.getElementById("lineColorSelect");
    const ballColorModeSelect = document.getElementById("ballColorModeSelect");
    const ballColorInput = document.getElementById("ballColorInput");
    const ballSizeSlider = document.getElementById("ballSizeSlider");
    const ballSizeVal = document.getElementById("ballSizeVal");

    function updateColorControlStates() {
      lineColorSelect.disabled = lineColorModeSelect.value !== "manual";
      ballColorInput.disabled = ballColorModeSelect.value !== "manual";
    }

    function getSelectedLineStyle() {
      if (lineColorModeSelect.value === "manual") {
        const idx = clamp(parseInt(lineColorSelect.value, 10) || 0, 0, LINE_STYLES.length - 1);
        return LINE_STYLES[idx];
      }
      return LINE_STYLES[Math.floor(Math.random() * LINE_STYLES.length)];
    }

    function getSelectedBallColor() {
      if (ballColorModeSelect.value === "manual") {
        return ballColorInput.value || BALL_COLORS[0];
      }
      return BALL_COLORS[Math.floor(Math.random() * BALL_COLORS.length)];
    }

    function getSelectedBallSize() {
      return clamp(parseFloat(ballSizeSlider.value), 4, 30);
    }

    lineColorModeSelect.addEventListener("change", updateColorControlStates);
    lineColorSelect.addEventListener("change", updateColorControlStates);
    ballColorModeSelect.addEventListener("change", updateColorControlStates);
    ballColorInput.addEventListener("input", updateColorControlStates);

    ballSizeSlider.addEventListener("input", (e) => {
      ballSizeVal.textContent = `${parseInt(e.target.value, 10)}px`;
    });

    updateColorControlStates();
    ballSizeVal.textContent = `${parseInt(ballSizeSlider.value, 10)}px`;

    const gravitySlider = document.getElementById("gravitySlider");
    const gravityVal = document.getElementById("gravityVal");
    gravitySlider.addEventListener("input", (e) => {
      gravityVal.textContent = parseFloat(e.target.value).toFixed(2);
    });

    const bounceSlider = document.getElementById("bounceSlider");
    const bounceVal = document.getElementById("bounceVal");
    bounceSlider.addEventListener("input", (e) => {
      bounceVal.textContent = parseFloat(e.target.value).toFixed(2);
    });

    const bounceLimitSlider = document.getElementById("bounceLimitSlider");
    const bounceLimitVal = document.getElementById("bounceLimitVal");
    bounceLimitSlider.addEventListener("input", (e) => {
      bounceLimitVal.textContent = `${e.target.value}回`;
    });

    const gravityModeSelect = document.getElementById("gravityModeSelect");
    const sensorBtn = document.getElementById("sensorBtn");

    let sensorGravity = { x: 0, y: 0 };
    let sensorListenerAdded = false;
    let sensorReady = false;
    const isIPhone = /iPhone|iPod/i.test(navigator.userAgent);

    function handleDeviceOrientation(e) {
      if (gravityModeSelect.value !== "sensor" || !sensorReady) return;

      const maxTilt = 35;
      const strength = parseFloat(gravitySlider.value) * 1.8;

      const gx = clamp(e.gamma ?? 0, -maxTilt, maxTilt) / maxTilt;
      const gy = clamp(e.beta ?? 0, -maxTilt, maxTilt) / maxTilt;

      sensorGravity.x = gx * strength;
      sensorGravity.y = gy * strength * (isIPhone ? 1 : -1);
    }

    async function enableSensor() {
      initAudio();

      try {
        if (
          typeof DeviceOrientationEvent !== "undefined" &&
          typeof DeviceOrientationEvent.requestPermission === "function"
        ) {
          const permission = await DeviceOrientationEvent.requestPermission();
          if (permission !== "granted") {
            alert("重力センサーの許可が必要です。");
            return;
          }
        }

        if (!sensorListenerAdded) {
          window.addEventListener("deviceorientation", handleDeviceOrientation, true);
          sensorListenerAdded = true;
        }

        sensorReady = true;
        gravityModeSelect.value = "sensor";
        sensorBtn.textContent = "センサー許可済み";
      } catch (err) {
        console.error(err);
        alert("センサーの初期化に失敗しました。HTTPS環境のSafariで開いてください。");
      }
    }

    sensorBtn.addEventListener("click", enableSensor);

    function updateScaleNotes() {
      const key = document.getElementById("keySelect").value;
      const scale = document.getElementById("scaleSelect").value;
      activeFreqs = getScaleNotes(key, scale);
    }

    updateScaleNotes();
    document.getElementById("keySelect").addEventListener("change", updateScaleNotes);
    document.getElementById("scaleSelect").addEventListener("change", updateScaleNotes);

    function getClosestPointOnSegment(px, py, ax, ay, bx, by) {
      const abx = bx - ax;
      const aby = by - ay;
      const apx = px - ax;
      const apy = py - ay;

      const abLenSq = abx * abx + aby * aby;
      if (abLenSq === 0) return { x: ax, y: ay };

      let t = (apx * abx + apy * aby) / abLenSq;
      t = Math.max(0, Math.min(1, t));

      return { x: ax + t * abx, y: ay + t * aby };
    }

    function getLineIntersection(p0_x, p0_y, p1_x, p1_y, p2_x, p2_y, p3_x, p3_y) {
      const s1_x = p1_x - p0_x;
      const s1_y = p1_y - p0_y;
      const s2_x = p3_x - p2_x;
      const s2_y = p3_y - p2_y;

      const denom = (-s2_x * s1_y + s1_x * s2_y);
      if (denom === 0) return false;

      const s = (-s1_y * (p0_x - p2_x) + s1_x * (p0_y - p2_y)) / denom;
      const t = (s2_x * (p0_y - p2_y) - s2_y * (p0_x - p2_x)) / denom;

      return (s >= 0 && s <= 1 && t >= 0 && t <= 1);
    }

    class Ball {
      constructor(x, y, vx = null, vy = null, radius = 10, color = null) {
        this.x = x;
        this.y = y;
        this.vx = (vx === null || vx === undefined) ? (Math.random() - 0.5) * 1.4 : vx;
        this.vy = (vy === null || vy === undefined) ? 0 : vy;
        this.radius = radius;
        this.color = color || BALL_COLORS[Math.floor(Math.random() * BALL_COLORS.length)];
        this.lastSoundTime = 0;
        this.alpha = 1.0;
        this.pulse = 0;
        this.bounceCount = 0;
        this.isExpiring = false;
      }

      update(gravityX, gravityY) {
        this.vx += gravityX;
        this.vy += gravityY;

        const nextX = this.x + this.vx;
        const nextY = this.y + this.vy;

        if (!this.isExpiring) {
          this.checkCollisions(nextX, nextY);
        }

        this.x += this.vx;
        this.y += this.vy;

        if (this.isExpiring) {
          this.alpha -= 0.08;
        } else if (
          this.y - this.radius > height ||
          this.x + this.radius < 0 ||
          this.x - this.radius > width
        ) {
          this.alpha -= 0.02;
        }

        if (this.pulse > 0) {
          this.pulse -= 0.05;
        }
      }

      checkCollisions(nextX, nextY) {
        const cooldown = 180;
        const now = Date.now();
        const steps = 4;
        let p1 = { x: this.x, y: this.y };

        const bounce = clamp(parseFloat(bounceSlider.value), 0.10, 0.98);
        const maxBounces = parseInt(bounceLimitSlider.value, 10);

        for (let s = 1; s <= steps; s++) {
          const t = s / steps;
          const p2 = {
            x: this.x + (nextX - this.x) * t,
            y: this.y + (nextY - this.y) * t
          };

          for (const line of lines) {
            const pts = line.points;
            if (pts.length < 2) continue;

            for (let i = 0; i < pts.length - 1; i++) {
              const a = pts[i];
              const b = pts[i + 1];

              const intersect = getLineIntersection(p1.x, p1.y, p2.x, p2.y, a.x, a.y, b.x, b.y);
              const closest = getClosestPointOnSegment(p2.x, p2.y, a.x, a.y, b.x, b.y);
              const dx = p2.x - closest.x;
              const dy = p2.y - closest.y;
              const dist = Math.sqrt(dx * dx + dy * dy);

              if (intersect || dist < this.radius) {
                let nx = -(b.y - a.y);
                let ny = b.x - a.x;
                const len = Math.sqrt(nx * nx + ny * ny);
                if (len === 0) continue;
                nx /= len;
                ny /= len;

                const dot = this.vx * nx + this.vy * ny;
                if (dot > 0) {
                  nx = -nx;
                  ny = -ny;
                }

                const vDotN = this.vx * nx + this.vy * ny;
                const impact = Math.abs(vDotN);

                this.vx = (this.vx - 2 * vDotN * nx) * bounce;
                this.vy = (this.vy - 2 * vDotN * ny) * bounce;

                const overlap = this.radius - dist;
                if (overlap > 0) {
                  this.x += nx * (overlap + 1.2);
                  this.y += ny * (overlap + 1.2);
                }

                if (impact > 1.1 && (now - this.lastSoundTime > cooldown)) {
                  this.triggerSound(closest.y, impact, line.soundPreset);
                  this.lastSoundTime = now;
                  this.pulse = 1.0;

                  this.bounceCount++;
                  if (this.bounceCount >= maxBounces) {
                    this.isExpiring = true;
                  }
                }

                this.vx *= 0.99;
                this.vy *= 0.99;
                return;
              }
            }
          }
          p1 = p2;
        }
      }

      triggerSound(hitY, impact, soundPreset) {
        if (activeFreqs.length === 0) return;

        const normalizedY = Math.min(Math.max(hitY / height, 0), 1);
        const index = Math.floor((1 - normalizedY) * activeFreqs.length);
        const freqIndex = Math.min(Math.max(index, 0), activeFreqs.length - 1);

        const freq = activeFreqs[freqIndex];
        const vel = Math.min(impact / 8, 1.0);

        playAmbientPad(freq, vel, soundPreset);
      }

      draw(ctx) {
        ctx.save();
        ctx.globalAlpha = Math.max(this.alpha, 0);

        if (this.pulse > 0) {
          ctx.save();
          ctx.globalAlpha = this.pulse * 0.55;
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.radius + this.pulse * 12, 0, Math.PI * 2);
          ctx.strokeStyle = this.color;
          ctx.lineWidth = 2;
          ctx.stroke();
          ctx.restore();
        }

        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.shadowColor = this.color;
        ctx.shadowBlur = 10;
        ctx.fill();

        ctx.shadowBlur = 0;
        ctx.lineWidth = 1;
        ctx.strokeStyle = "rgba(255,255,255,0.16)";
        ctx.stroke();

        ctx.restore();
      }
    }

    let isDrawing = false;
    let dragDistance = 0;

    function getPos(e) {
      if (e.touches && e.touches.length > 0) {
        return { x: e.touches[0].clientX, y: e.touches[0].clientY };
      }
      return { x: e.clientX, y: e.clientY };
    }

    function pushHistory(action) {
      historyStack.push(action);
      if (historyStack.length > 600) {
        historyStack.shift();
      }
    }

    function pruneHistory(type) {
      historyStack = historyStack.filter((a) => a.type !== type);
    }

    function undoLastAction() {
      if (currentLine) {
        currentLine = null;
        isDrawing = false;
        dragDistance = 0;
        return;
      }

      while (historyStack.length > 0) {
        const action = historyStack.pop();

        if (action.type === "line") {
          const idx = lines.indexOf(action.ref);
          if (idx !== -1) {
            lines.splice(idx, 1);
            return;
          }
        } else if (action.type === "ball") {
          const idx = balls.indexOf(action.ref);
          if (idx !== -1) {
            balls.splice(idx, 1);
            return;
          }
        }
      }
    }

    function spawnBall(x, y, vx = 0, vy = 0, record = true, addHistory = true) {
      const ball = new Ball(
        x,
        y,
        vx,
        vy,
        getSelectedBallSize(),
        getSelectedBallColor()
      );
      balls.push(ball);

      if (addHistory) {
        pushHistory({ type: "ball", ref: ball });
      }

      if (isRecording && record) {
        const now = Date.now();

        if (recStartTime === null) {
          recStartTime = now;
          recordedEvents.push({ relTime: 0, x, y, vx, vy });
        } else {
          const relTime = now - recStartTime;
          recordedEvents.push({ relTime, x, y, vx, vy });
        }
      }

      return ball;
    }

    function commitLine(line, addHistory = true) {
      lines.push(line);
      if (addHistory) {
        pushHistory({ type: "line", ref: line });
      }
    }

    function handleStart(e) {
      if (e.target.closest(".settings-panel") || e.target.closest(".action-bar") || e.target.closest(".menu-toggle")) return;
      if (e.button !== undefined && e.button !== 0) return;

      if (e.cancelable) e.preventDefault();
      initAudio();

      const pos = getPos(e);
      isDrawing = true;
      dragDistance = 0;

      const style = getSelectedLineStyle();
      currentLine = {
        points: [pos],
        color: style.color,
        soundPreset: style.soundPreset,
        styleName: style.name
      };
    }

    function handleMove(e) {
      if (!isDrawing || !currentLine) return;
      if (e.cancelable) e.preventDefault();

      const pos = getPos(e);
      const lastPos = currentLine.points[currentLine.points.length - 1];
      const dist = Math.hypot(pos.x - lastPos.x, pos.y - lastPos.y);

      if (dist > 5) {
        currentLine.points.push(pos);
        dragDistance += dist;
      }
    }

    function handleEnd() {
      if (!isDrawing) return;
      isDrawing = false;

      if (dragDistance < 10 && currentLine && currentLine.points.length > 0) {
        const pos = currentLine.points[0];
        spawnBall(pos.x, pos.y, 0, 0, true, true);
      } else if (currentLine && currentLine.points.length > 1) {
        commitLine(currentLine, true);
      }

      currentLine = null;
    }

    canvas.addEventListener("mousedown", handleStart);
    window.addEventListener("mousemove", handleMove);
    window.addEventListener("mouseup", handleEnd);
    canvas.addEventListener("contextmenu", (e) => e.preventDefault());

    canvas.addEventListener("touchstart", handleStart, { passive: false });
    canvas.addEventListener("touchmove", handleMove, { passive: false });
    window.addEventListener("touchend", handleEnd);
    window.addEventListener("touchcancel", handleEnd);

    const recBtn = document.getElementById("recBtn");
    const recTimeDisplay = document.getElementById("recTimeDisplay");
    const undoBtn = document.getElementById("undoBtn");

    recBtn.addEventListener("click", () => {
      initAudio();
      if (isRecording) {
        stopRecording();
      } else {
        startRecording();
      }
    });

    undoBtn.addEventListener("click", () => {
      undoLastAction();
    });

    window.addEventListener("keydown", (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") {
        e.preventDefault();
        undoLastAction();
      }

      if (e.key === "Escape") {
        setSettingsOpen(false);
        currentLine = null;
        isDrawing = false;
        dragDistance = 0;
      }
    });

    function startRecording() {
      isRecording = true;
      recStartTime = null;
      recordedEvents = [];

      recBtn.classList.add("recording");
      recBtn.innerText = "STOP REC";
      recTimeDisplay.style.display = "inline-block";
      recTimeDisplay.textContent = "待機";

      stopLoopPlayback();
    }

    function stopRecording() {
      if (!isRecording) return;

      isRecording = false;

      if (recStartTime !== null) {
        loopDuration = Date.now() - recStartTime;
      } else {
        loopDuration = 0;
      }

      recBtn.classList.remove("recording");
      recBtn.innerText = "START REC";
      recTimeDisplay.style.display = "none";

      if (recordedEvents.length > 0 && loopDuration > 200) {
        startLoopPlayback();
      }

      recStartTime = null;
    }

    function startLoopPlayback() {
      stopLoopPlayback();
      if (recordedEvents.length === 0 || loopDuration <= 0) return;

      const scheduleLoop = () => {
        recordedEvents.forEach((evt) => {
          const tid = setTimeout(() => {
            spawnBall(evt.x, evt.y, evt.vx, evt.vy, false, false);
          }, evt.relTime);
          activeLoopTimeouts.push(tid);
        });

        const loopTid = setTimeout(scheduleLoop, loopDuration);
        activeLoopTimeouts.push(loopTid);
      };

      scheduleLoop();
    }

    function stopLoopPlayback() {
      activeLoopTimeouts.forEach((id) => clearTimeout(id));
      activeLoopTimeouts = [];
    }

    document.getElementById("clearLinesBtn").addEventListener("click", () => {
      lines = [];
      currentLine = null;
      isDrawing = false;
      dragDistance = 0;
      pruneHistory("line");
    });

    document.getElementById("clearBallsBtn").addEventListener("click", () => {
      balls = [];
      pruneHistory("ball");
    });

    document.getElementById("clearLoopBtn").addEventListener("click", () => {
      recordedEvents = [];
      stopLoopPlayback();
    });

    function render() {
      ctx.clearRect(0, 0, width, height);

      const gravity = parseFloat(gravitySlider.value);
      const useSensor = gravityModeSelect.value === "sensor" && sensorReady;

      const gravityX = useSensor ? sensorGravity.x : 0;
      const gravityY = useSensor ? sensorGravity.y : gravity;

      ctx.save();
      ctx.lineWidth = 3.5;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.shadowBlur = 0;

      for (const line of lines) {
        if (line.points.length < 2) continue;

        ctx.beginPath();
        ctx.moveTo(line.points[0].x, line.points[0].y);
        for (let i = 1; i < line.points.length; i++) {
          ctx.lineTo(line.points[i].x, line.points[i].y);
        }
        ctx.strokeStyle = line.color;
        ctx.stroke();
      }

      if (currentLine && currentLine.points.length > 1) {
        ctx.beginPath();
        ctx.moveTo(currentLine.points[0].x, currentLine.points[0].y);
        for (let i = 1; i < currentLine.points.length; i++) {
          ctx.lineTo(currentLine.points[i].x, currentLine.points[i].y);
        }
        ctx.strokeStyle = currentLine.color || "rgba(255,255,255,0.88)";
        ctx.lineWidth = 3.5;
        ctx.stroke();
      }
      ctx.restore();

      for (let i = balls.length - 1; i >= 0; i--) {
        const ball = balls[i];
        ball.update(gravityX, gravityY);
        ball.draw(ctx);

        if (ball.alpha <= 0) {
          balls.splice(i, 1);
        }
      }

      if (isRecording) {
        if (recStartTime !== null) {
          const elapsed = (Date.now() - recStartTime) / 1000;
          recTimeDisplay.textContent = `${elapsed.toFixed(1)}s`;
        } else {
          recTimeDisplay.textContent = "待機";
        }
      }

      requestAnimationFrame(render);
    }

    render();
  </script>
</body>
</html>
